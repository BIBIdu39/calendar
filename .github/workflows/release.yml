name: Release

on:
  push:
    tags:
      - 'v*'  # Déclenché à chaque tag comme v1.0.0, v1.1.0, etc.

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Calendar ${{ github.ref_name }}'
          releaseBody: |
            ## 🆕 Mise à jour Calendar ${{ github.ref_name }}

            L'application se met à jour automatiquement au prochain démarrage.

            ### Installation (premier téléchargement)
            Téléchargez et lancez `Calendar_x64-setup.exe` ci-dessous.
          releaseDraft: false
          prerelease: false
